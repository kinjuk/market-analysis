name: Build site data
on:
  schedule: [{ cron: "0 6 * * 0" }]   # weekly, Sunday 06:00 UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pe-strategies/requirements.txt }
      - run: pip install -r pe-strategies/requirements.txt
      - run: python build_data.py
        working-directory: pe-strategies
        env: { SEC_USER_AGENT: "${{ secrets.SEC_USER_AGENT }}" }
      - run: |
          git config user.name "site-data-bot"
          git config user.email "site-data-bot@users.noreply.github.com"
          git add pe-strategies/app/data
          git diff --cached --quiet || git commit -m "refresh site data $(date -u +%F)"
          git push
