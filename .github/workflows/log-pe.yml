name: Log forward P/E
on:
  schedule: [{ cron: "30 22 * * 1-5" }]   # after the US close, weekdays (UTC)
  workflow_dispatch:
permissions: { contents: write }
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pe-strategies/requirements.txt }
      - run: pip install -r pe-strategies/requirements.txt
      - run: python pe-strategies/log_pe.py
      - run: |
          git config user.name "pe-logger"
          git config user.email "pe-logger@users.noreply.github.com"
          git add pe-strategies/data/forward_pe.csv
          git diff --cached --quiet || git commit -m "log forward P/E $(date -u +%F)"
          git push
